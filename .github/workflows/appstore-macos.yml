name: "Build Mac App Store Package"

on:
  workflow_dispatch:

jobs:
  appstore-package:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      APP_SIGN_IDENTITY: "${{ vars.APP_SIGN_IDENTITY || 'Apple Distribution: MyongSung Noh (HDQ2YRZVGB)' }}"
      MAC_INSTALLER_IDENTITY: "${{ vars.MAC_INSTALLER_IDENTITY || '3rd Party Mac Developer Installer: MyongSung Noh (HDQ2YRZVGB)' }}"
      KEYCHAIN_PASSWORD: "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}"

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: ensure bundled model
        env:
          ROOSYCOZY_MODEL_PATH: "${{ vars.ROOSYCOZY_MODEL_PATH }}"
          ROOSYCOZY_MODEL_URL: "${{ secrets.ROOSYCOZY_MODEL_URL || vars.ROOSYCOZY_MODEL_URL || 'https://github.com/myongsung/roosycozy-models/releases/download/model_v1/HyperCLOVAX-SEED-Text-Instruct-0.5B-q4_0.gguf' }}"
          ROOSYCOZY_MODEL_SHA256: "${{ secrets.ROOSYCOZY_MODEL_SHA256 || vars.ROOSYCOZY_MODEL_SHA256 }}"
        run: npm run ci:ensure-model

      - name: write provisioning profile
        env:
          APPLE_PROVISION_PROFILE_BASE64: "${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}"
        run: |
          if [[ -z "${APPLE_PROVISION_PROFILE_BASE64:-}" ]]; then
            echo "APPLE_PROVISION_PROFILE_BASE64 secret가 필요합니다."
            exit 1
          fi
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | openssl base64 -d -A -out src-tauri/embedded.provisionprofile

      - name: import Apple certificates
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: "${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}"
          APPLE_DISTRIBUTION_CERT_PASSWORD: "${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}"
          APPLE_INSTALLER_CERT_P12_BASE64: "${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}"
          APPLE_INSTALLER_CERT_PASSWORD: "${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}"
        run: |
          if [[ -z "${APPLE_DISTRIBUTION_CERT_P12_BASE64:-}" || -z "${APPLE_DISTRIBUTION_CERT_PASSWORD:-}" || -z "${APPLE_INSTALLER_CERT_P12_BASE64:-}" || -z "${APPLE_INSTALLER_CERT_PASSWORD:-}" || -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "App Store 서명용 secrets가 아직 덜 설정되어 있어요."
            exit 1
          fi

          APP_CERT_PATH="$RUNNER_TEMP/apple-distribution.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/apple-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/appstore-build.keychain-db"

          printf '%s' "$APPLE_DISTRIBUTION_CERT_P12_BASE64" | openssl base64 -d -A -out "$APP_CERT_PATH"
          printf '%s' "$APPLE_INSTALLER_CERT_P12_BASE64" | openssl base64 -d -A -out "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: build App Store .app
        run: npm run appstore:build

      - name: build App Store .pkg
        run: npm run appstore:pkg

      - name: upload App Store package
        uses: actions/upload-artifact@v6
        with:
          name: roosycozy-mac-app-store-pkg
          path: src-tauri/target/release/bundle/appstore/*.pkg
          if-no-files-found: error
