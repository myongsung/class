name: "Build Windows Portable"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-portable:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: ensure bundled model
        env:
          ROOSYCOZY_MODEL_PATH: "${{ vars.ROOSYCOZY_MODEL_PATH }}"
          ROOSYCOZY_MODEL_URL: "${{ secrets.ROOSYCOZY_MODEL_URL || vars.ROOSYCOZY_MODEL_URL || 'https://github.com/myongsung/roosycozy-models/releases/download/model_v1/HyperCLOVAX-SEED-Text-Instruct-0.5B-q4_0.gguf' }}"
          ROOSYCOZY_MODEL_SHA256: "${{ secrets.ROOSYCOZY_MODEL_SHA256 || vars.ROOSYCOZY_MODEL_SHA256 }}"
        run: npm run ci:ensure-model

      - name: ensure windows runtime bundle
        env:
          ROOSYCOZY_WINDOWS_RUNTIME_URL: "${{ secrets.ROOSYCOZY_WINDOWS_RUNTIME_URL || vars.ROOSYCOZY_WINDOWS_RUNTIME_URL || 'https://github.com/ggml-org/llama.cpp/releases/download/b8763/llama-b8763-bin-win-cpu-x64.zip' }}"
        run: npm run ci:ensure-windows-runtime

      - name: build windows portable bundle
        run: npm run windows:portable

      - name: upload windows portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: roosycozy-windows-x64-portable
          path: src-tauri/target/release/portable/roosycozy-windows-x64/
          if-no-files-found: error
