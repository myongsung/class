name: "Build Windows Portable"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-portable:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: ensure bundled model
        env:
          ROOSYCOZY_MODEL_PATH: "${{ vars.ROOSYCOZY_MODEL_PATH }}"
          ROOSYCOZY_MODEL_URL: "${{ secrets.ROOSYCOZY_MODEL_URL || vars.ROOSYCOZY_MODEL_URL }}"
          ROOSYCOZY_MODEL_SHA256: "${{ secrets.ROOSYCOZY_MODEL_SHA256 || vars.ROOSYCOZY_MODEL_SHA256 }}"
        run: npm run ci:ensure-model

      - name: build windows portable bundle
        run: npm run windows:portable

      - name: compress windows portable bundle
        shell: pwsh
        run: |
          $portableDir = "src-tauri/target/release/portable/roosycozy-windows-x64"
          $zipPath = "src-tauri/target/release/portable/roosycozy-windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $portableDir -DestinationPath $zipPath -Force

      - name: upload windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-windows-x64-portable
          path: src-tauri/target/release/portable/roosycozy-windows-x64.zip
          if-no-files-found: error
