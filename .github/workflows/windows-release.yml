name: "Build Windows Portable Release"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: prepare placeholder models for Windows CI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/models | Out-Null
          if (-not (Test-Path src-tauri/resources/models/HyperCLOVAX-SEED-Text-Instruct-0.5B-q4_0.gguf)) {
            New-Item -ItemType File -Path src-tauri/resources/models/HyperCLOVAX-SEED-Text-Instruct-0.5B-q4_0.gguf | Out-Null
          }
          if (-not (Test-Path src-tauri/resources/models/hyperclovax_roosy_Q4_K_M.gguf)) {
            New-Item -ItemType File -Path src-tauri/resources/models/hyperclovax_roosy_Q4_K_M.gguf | Out-Null
          }

      - name: resolve version
        id: meta
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          if (-not $version) {
            throw "Could not resolve package.json version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: ensure windows runtime bundle
        env:
          ROOSYCOZY_WINDOWS_RUNTIME_URL: "${{ secrets.ROOSYCOZY_WINDOWS_RUNTIME_URL || vars.ROOSYCOZY_WINDOWS_RUNTIME_URL || 'https://github.com/ggml-org/llama.cpp/releases/download/b8763/llama-b8763-bin-win-cpu-x64.zip' }}"
        run: npm run ci:ensure-windows-runtime

      - name: build windows portable app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run windows:portable

      - name: stage windows runtime asset
        run: node ./scripts/stage-windows-runtime.mjs

      - name: Compress portable exe for auto-updater
        shell: pwsh
        run: |
          cd src-tauri/target/release/portable/roosycozy-windows-x64
          if (Test-Path roosycozy-x86_64-pc-windows-msvc.zip) {
            Remove-Item roosycozy-x86_64-pc-windows-msvc.zip -Force
          }
          Compress-Archive -Path roosycozy.exe,RoosyCozy -DestinationPath roosycozy-x86_64-pc-windows-msvc.zip

      - name: Compress windows runtime asset
        shell: pwsh
        run: |
          cd src-tauri/target/release/runtime/roosycozy-windows-runtime
          if (Test-Path roosycozy-windows-runtime.zip) {
            Remove-Item roosycozy-windows-runtime.zip -Force
          }
          Compress-Archive -Path * -DestinationPath roosycozy-windows-runtime.zip

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.meta.outputs.version }}"
          $title = "App Build v${{ steps.meta.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes "Automated Windows portable build." --latest
          } else {
            gh release edit $tag --title $title --notes "Automated Windows portable build." --latest
          }

      - name: Upload ZIP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload v${{ steps.meta.outputs.version }} src-tauri/target/release/portable/roosycozy-windows-x64/roosycozy-x86_64-pc-windows-msvc.zip --clobber
          gh release upload v${{ steps.meta.outputs.version }} src-tauri/target/release/runtime/roosycozy-windows-runtime/roosycozy-windows-runtime.zip --clobber

      - name: upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-windows-x64-portable
          path: |
            src-tauri/target/release/portable/roosycozy-windows-x64/roosycozy.exe
            src-tauri/target/release/portable/roosycozy-windows-x64/RoosyCozy/
          if-no-files-found: error
