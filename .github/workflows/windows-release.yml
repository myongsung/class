name: "Build Windows EXE"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: resolve version
        id: meta
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          if (-not $version) {
            throw "Could not resolve package.json version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: build the app (portable exe + release)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.meta.outputs.version }}
          releaseName: "App Build v${{ steps.meta.outputs.version }}"
          appVersion: ${{ steps.meta.outputs.version }}
          releaseBody: "Automated Windows build."
          releaseDraft: false
          prerelease: false
          args: --no-bundle
          uploadPlainBinary: true

      - name: Compress portable exe for auto-updater
        shell: pwsh
        run: |
          cd src-tauri/target/release
          if (Test-Path roosycozy-x86_64-pc-windows-msvc.zip) {
            Remove-Item roosycozy-x86_64-pc-windows-msvc.zip -Force
          }
          Compress-Archive -Path roosycozy.exe -DestinationPath roosycozy-x86_64-pc-windows-msvc.zip

      - name: Upload ZIP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload v${{ steps.meta.outputs.version }} src-tauri/target/release/roosycozy-x86_64-pc-windows-msvc.zip --clobber

      - name: upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-portable-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error

      - name: upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roosycozy-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
